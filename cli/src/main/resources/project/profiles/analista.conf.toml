default_permissions = "analista-{module}"

[permissions."analista-{module}"]
description = "Analista del módulo {module}: lectura del proyecto y escritura solo en docs/sprints/ y docs/changes/."
extends = ":read-only"

[permissions."analista-{module}".filesystem]
glob_scan_max_depth = 3

[permissions."analista-{module}".filesystem.":workspace_roots"]
"docs/sprints" = "write"
"docs/changes" = "write"
"**/*.env" = "deny"
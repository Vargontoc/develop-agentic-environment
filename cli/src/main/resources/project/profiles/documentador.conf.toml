default_permissions = "documentador-{module}"

[permissions."documentador-{module}"]
description = "Documentador del módulo {module}: lectura del proyecto y escritura en docs/, .sdd/, specs/ y README.md; sin red."
extends = ":read-only"

[permissions."documentador-{module}".filesystem]
glob_scan_max_depth = 3

[permissions."documentador-{module}".filesystem.":workspace_roots"]
"docs" = "write"
".sdd" = "write"
"specs" = "write"
"README.md" = "write"
"**/*.env" = "deny"